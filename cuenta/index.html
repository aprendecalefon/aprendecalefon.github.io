<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta | Aprende Calefón</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../assets/aprende-calefon-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f6;--card:#fff;--ink:#1d1418;--muted:#6f6067;--line:#ece4e7;--brand:#f26a0c;--soft:#fff3ea}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--brand);font-weight:700;text-decoration:none}
header{background:#fff;border-bottom:1px solid var(--line)}.hd{max-width:1100px;margin:auto;padding:0 16px;height:64px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:900;font-size:19px}.logo img{width:30px;height:30px}
main{flex:1;display:grid;place-items:center;padding:30px 16px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 10px 30px #1d141812}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.4px}.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f3eef0;border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
input:focus{outline:2px solid #ffd2b0;border-color:var(--brand)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;cursor:pointer;margin-top:16px}
.pri{background:var(--brand);color:#fff}.pri:disabled{opacity:.6}
.gg{background:#fff;border:1.5px solid var(--line);color:var(--ink);margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 0}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:10px;display:none}.msg.err{display:block;background:var(--soft);color:#8a1f19}.msg.ok{display:block;background:#effaf3;color:#14532d}
.foot{text-align:center;font-size:14px;color:var(--muted);margin-top:16px}
[hidden]{display:none!important}
</style></head><body>
<header><div class="hd"><a class="logo" href="../"><img src="../assets/aprende-calefon-mark.svg" alt="">Aprende Calefón</a></div></header>
<main><div class="box">
  <h1 id="ttl">Entra a tu aula</h1><p class="sub" id="sub">Ingresa o crea tu cuenta para ver los cursos.</p>
  <div class="tabs"><button type="button" id="tIn" class="on">Ingresar</button><button type="button" id="tUp">Crear cuenta</button></div>
  <form id="f" novalidate>
    <div id="nameRow" hidden><label for="name">Nombre completo</label><input id="name" autocomplete="name" placeholder="Ej: Juan Pérez Soto"><div class="hint">Así aparecerá en tu certificado.</div></div>
    <label for="email">Correo</label><input id="email" type="email" autocomplete="email" placeholder="tucorreo@gmail.com">
    <div class="hint" id="gmailHint" hidden>Usa tu Gmail: con ese correo se te da acceso a los videos.</div>
    <label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
    <button class="btn pri" id="go" type="submit">Ingresar</button>
  </form>
  <div class="or">o</div>
  <button class="btn gg" id="google" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuar con Google</button>
  <div class="msg" id="msg"></div>
  <div class="foot" id="forgotRow"><a href="#" id="forgot">¿Olvidaste tu contraseña?</a></div>
</div></main>
<script type="module">
import { auth, ensureProfile, authError, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, updateProfile } from "../js/firebase.js";
const $ = id => document.getElementById(id);
let mode = new URLSearchParams(location.search).get("modo") === "registro" ? "up" : "in";
const next = () => { const n = new URLSearchParams(location.search).get("next"); return n && n.startsWith("/") ? n : "../aula/"; };
function setMode(m){ mode=m; $("tIn").classList.toggle("on",m==="in"); $("tUp").classList.toggle("on",m==="up");
  $("nameRow").hidden=m!=="up"; $("gmailHint").hidden=m!=="up"; $("forgotRow").hidden=m!=="in";
  $("go").textContent=m==="up"?"Crear cuenta":"Ingresar"; $("ttl").textContent=m==="up"?"Crea tu cuenta":"Entra a tu aula";
  $("sub").textContent=m==="up"?"Con tu cuenta ves tus cursos, guardas tu avance y obtienes tu certificado.":"Ingresa o crea tu cuenta para ver los cursos.";
  $("pass").autocomplete=m==="up"?"new-password":"current-password"; msg(""); }
function msg(t,ok){ const m=$("msg"); m.textContent=t; m.className="msg"+(t?(ok?" ok":" err"):""); }
$("tIn").onclick=()=>setMode("in"); $("tUp").onclick=()=>setMode("up"); setMode(mode);
let busy=false;
$("f").onsubmit=async e=>{ e.preventDefault(); if(busy)return; const email=$("email").value.trim(), pass=$("pass").value, name=$("name").value.trim();
  if(mode==="up"&&name.split(/\s+/).length<2){ msg("Escribe tu nombre y apellido, tal como quieres que salga en tu certificado."); return; }
  busy=true; $("go").disabled=true; msg("");
  try{
    if(mode==="up"){ const r=await createUserWithEmailAndPassword(auth,email,pass); await updateProfile(r.user,{displayName:name}); await ensureProfile(r.user,name); }
    else { const r=await signInWithEmailAndPassword(auth,email,pass); await ensureProfile(r.user); }
    location.href=next();
  }catch(err){ msg(authError(err)); } finally{ busy=false; $("go").disabled=false; } };
$("google").onclick=async()=>{ msg(""); try{ const r=await signInWithPopup(auth,new GoogleAuthProvider()); await ensureProfile(r.user); location.href=next(); }catch(err){ msg(authError(err)); } };
$("forgot").onclick=async e=>{ e.preventDefault(); const email=$("email").value.trim(); if(!email){ msg("Escribe tu correo arriba y vuelve a tocar “¿Olvidaste tu contraseña?”."); return; }
  try{ await sendPasswordResetEmail(auth,email); msg("Te enviamos un correo para crear una contraseña nueva. Revisa también spam.",true); }catch(err){ msg(authError(err)); } };
onAuthStateChanged(auth,u=>{ if(u&&!busy) $("sub").innerHTML='Ya iniciaste sesión como <b>'+(u.email||'')+'</b>. <a href="'+next()+'">Ir a mi aula →</a>'; });
</script>
</body></html>
